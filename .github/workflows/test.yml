name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e . pytest pytest-cov

      - name: Require full skppy coverage
        run: pytest --cov=skppy --cov-report=term-missing --cov-fail-under=100

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest

      - name: Run unit tests
        run: pytest -v --tb=short

  skppy-tests:
    name: skppy-tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out skppy
        uses: actions/checkout@v6
        with:
          path: skppy
          fetch-depth: 0

      - name: Check out skppy-tests
        uses: actions/checkout@v6
        with:
          repository: dantedex/skppy-tests
          path: skppy_tests
          # Fine-grained PAT with Contents: Read when the suite is private.
          token: ${{ secrets.SKPPY_TESTS_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skppy/pyproject.toml

      - name: Install skppy and test dependencies
        run: pip install -e ./skppy pytest

      - name: Run public conformance-suite Python tests
        working-directory: skppy_tests
        run: python -m pytest -q

  sdk-conformance:
    name: skppy-tests public SDK conformance
    runs-on: windows-latest

    steps:
      - name: Check out skppy
        uses: actions/checkout@v6
        with:
          path: skppy
          fetch-depth: 0

      - name: Check out skppy-tests
        uses: actions/checkout@v6
        with:
          repository: dantedex/skppy-tests
          path: skppy_tests
          # Fine-grained PAT with Contents: Read when the suite is private.
          token: ${{ secrets.SKPPY_TESTS_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: skppy/pyproject.toml

      - name: Install skppy and test dependencies
        run: pip install -e ./skppy pytest

      - name: Install public SDK test toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Generate and validate current parser fixtures
        working-directory: skppy_tests
        shell: msys2 {0}
        run: |
          temp_root="$(cygpath -u "$RUNNER_TEMP")"
          output_dir="$temp_root/skppy-tests-current"
          python_exe="$(cygpath -u "$pythonLocation/python.exe")"
          make generate CC=gcc RUNNER= NATIVE_RUNNER=1 \
            PYTHON="$python_exe" OUTPUT_DIR="$output_dir"
          OUTPUT_DIR="$(cygpath -w "$output_dir")" "$python_exe" run_tests.py

      - name: Validate every supported public save target
        working-directory: skppy_tests
        shell: msys2 {0}
        run: |
          python_exe="$(cygpath -u "$pythonLocation/python.exe")"
          make release-matrix CC=gcc RUNNER= NATIVE_RUNNER=1 \
            PATH_CONVERTER="cygpath -w" PYTHON="$python_exe" \
            SKPPY_PATH="$(cygpath -u "$GITHUB_WORKSPACE")/skppy" \
            OUTPUT_DIR="$(cygpath -u "$RUNNER_TEMP")/skppy-tests-matrix" \
            MATRIX_JOBS=4

      - name: Validate modern writer output through the public SDK
        working-directory: skppy_tests
        shell: msys2 {0}
        run: |
          python_exe="$(cygpath -u "$pythonLocation/python.exe")"
          make writer-validation CC=gcc RUNNER= PATH_CONVERTER="cygpath -w" \
            PYTHON="$python_exe" SKPPY_PATH="$(cygpath -u "$GITHUB_WORKSPACE")/skppy" \
            OUTPUT_DIR="$(cygpath -u "$RUNNER_TEMP")/skppy-tests-writer"

      - name: Validate SketchUp Make 2017 writer output through the public SDK
        working-directory: skppy_tests
        shell: msys2 {0}
        run: |
          python_exe="$(cygpath -u "$pythonLocation/python.exe")"
          make legacy-writer-validation CC=gcc RUNNER= PATH_CONVERTER="cygpath -w" \
            PYTHON="$python_exe" SKPPY_PATH="$(cygpath -u "$GITHUB_WORKSPACE")/skppy" \
            OUTPUT_DIR="$(cygpath -u "$RUNNER_TEMP")/skppy-tests-legacy-writer"
