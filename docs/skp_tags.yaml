schema_version: 1
last_updated: "2026-03-27"
scope:
  format: "SketchUp .skp"
  payload: "model.dat TLV records"
  note: "Observation-based map from analysed .skp files; unknown tags remain explicitly unresolved."

container:
  file_header:
    signature_text: "SketchUp Model"
    version_string_pattern: "{major.minor.build}"
    zip_payload_start: "first PK\\x03\\x04 signature"
  zip_entries_common:
    - "model.dat"
    - "meta/meta.dat"
    - "styles/.../style.xml"
    - "materials/<name>/material.xml"
    - "materials/<name>/<texture files>"

