materials_xml_schema:
  root: "mat:material"
  core_attributes:
    - name
    - type
    - workflow
    - colorRed
    - colorGreen
    - colorBlue
    - trans
    - useTrans
    - hasTexture
    - colorizeType
  texture_node: "mat:texture"
  pbr_node: "mat:pbrMR"

notes:
  - "Transforms in instance records are encoded as 13 doubles: 3x3 basis + translation + homogeneous scale."
  - "Observed transform storage order in the 13-double payload is [m00,m10,m20,m01,m11,m21,m02,m12,m22,tx,ty,tz,w]."
  - "Component instance tag 0x1967 matches definition IDs encoded in 0x157C via 0x07D0 -> 0x05DC -> 0x05DE."
  - "IDs are commonly encoded as varint-like little-endian payloads, often inside 0x05DC -> 0x05DE."
  - "Heuristic TLV exploration may surface pseudo-tags (notably 0x0000 and some 0x40xx values) from fixed-size numeric payload bytes."
  - "Several tags intentionally keep generic field_* naming until their exact semantics are confirmed."
