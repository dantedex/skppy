line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "C90", # McCabe complexity
    "PLR0912", # excessive branches
    "PLR0915", # excessive statements
    "RUF", # ruff-specific rules
]

ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name (l, I, O)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are allowed
"tests/**/*.py" = ["C901", "PLR0912", "PLR0915"]  # fixture assembly is intentionally linear

[format]
quote-style = "double"
indent-style = "space"
